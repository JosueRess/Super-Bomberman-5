name: Construir Super Bomberman 5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Fazer checkout do repositorio
        uses: actions/checkout@v4

      - name: Baixar fork do Ludere
        run: |
          set -e
          git clone --depth 1 \
            https://github.com/JosueRess/Ludere.git ludere

      - name: Instalar dependencias
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            xmlstarlet imagemagick unzip file python3

      - name: Preparar payload do jogo
        run: |
          set -e

          PAYLOAD="SuperBomberman5_Autogen_Payload.zip"

          if [ ! -f "$PAYLOAD" ]; then
            echo "ERRO: payload nao encontrado: $PAYLOAD"
            ls -la
            exit 1
          fi

          mkdir -p ludere/autogen/input

          cp "$PAYLOAD" ludere/autogen/input/payload.zip

          unzip -o ludere/autogen/input/payload.zip \
            -d ludere/autogen/input/

          rm -f ludere/autogen/input/payload.zip

          echo "Conteudo da pasta input:"
          find ludere/autogen/input -maxdepth 3 -type f -print

      - name: Corrigir gerador do Ludere
        run: |
          set -e

          GENERATOR="ludere/autogen/generate"

          if [ ! -f "$GENERATOR" ]; then
            echo "ERRO: autogen/generate nao encontrado."
            exit 1
          fi

          python3 - "$GENERATOR" <<'PY'
          import re
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          # Interrompe a execucao se uma compilacao falhar.
          if not content.startswith("#!/usr/bin/env bash\n"):
              raise SystemExit(
                  "ERRO: cabecalho inesperado em autogen/generate."
              )

          if "set -e" not in content.splitlines()[:5]:
              content = content.replace(
                  "#!/usr/bin/env bash\n",
                  "#!/usr/bin/env bash\nset -e\n",
                  1
              )

          # Em vez de ignorar IDs que nao comecam com letra,
          # adiciona um prefixo valido.
          pattern = (
              r'if \[\[ ! "\$romid" =~ \^\[a-z\] \]\]'
              r'\s*then\s*'
              r'err "\$romid must start with a letter! Skipping\.\.\."'
              r'\s*continue\s*fi'
          )

          replacement = '''if [[ ! "$romid" =~ ^[a-z] ]]
          then
              log "Adicionando prefixo game_ ao ID: $romid"
              romid="game_${romid}"
          fi'''

          content, count = re.subn(
              pattern, replacement, content, count=1
          )

          if count != 1:
              raise SystemExit(
                  "ERRO: nao encontrei o bloco esperado para corrigir "
                  "o ROM ID. O gerador pode ter mudado."
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Gerador corrigido.")
          PY

          chmod +x "$GENERATOR"

      - name: Preparar icone personalizado
        run: |
          set -e

          RES="ludere/app/src/main/res"
          TEMP="/tmp/superbomberman-icon.png"

          ICON="$(find . \
            -path './.git' -prune -o \
            -path './ludere' -prune -o \
            -type f -iname 'icon.png' -print -quit)"

          if [ -z "$ICON" ]; then
            ICON="$(find "$RES" -type f \
              -iname 'icon.png' -print -quit)"
          fi

          if [ -z "$ICON" ] || [ ! -f "$ICON" ]; then
            echo "ERRO: icon.png nao encontrado."
            echo "Coloque icon.png na raiz do repositorio principal."
            exit 1
          fi

          echo "Imagem original: $ICON"
          file "$ICON"

          convert "$ICON" \
            -background none \
            -alpha on \
            -strip \
            "PNG32:$TEMP"

          SIGNATURE="$(od -An -tx1 -N8 "$TEMP" | tr -d ' \n')"

          if [ "$SIGNATURE" != "89504e470d0a1a0a" ]; then
            echo "ERRO: a imagem convertida nao e PNG valido."
            exit 1
          fi

          for ITEM in \
            "mipmap-mdpi 48" \
            "mipmap-hdpi 72" \
            "mipmap-xhdpi 96" \
            "mipmap-xxhdpi 144" \
            "mipmap-xxxhdpi 192"
          do
            set -- $ITEM
            DIR="$RES/$1"
            SIZE="$2"

            mkdir -p "$DIR"

            convert "$TEMP" -resize "${SIZE}x${SIZE}" \
              "$DIR/ic_launcher.png"

            convert "$TEMP" -resize "${SIZE}x${SIZE}" \
              "$DIR/ic_launcher_round.png"
          done

          # Corrige tambem o arquivo que causou o erro do AAPT.
          mkdir -p "$RES/mipmap-xxxhdpi"

          convert "$TEMP" -resize 192x192 \
            "$RES/mipmap-xxxhdpi/icon.png"

          file "$RES/mipmap-xxxhdpi/icon.png"

          SIGNATURE="$(od -An -tx1 -N8 \
            "$RES/mipmap-xxxhdpi/icon.png" | tr -d ' \n')"

          if [ "$SIGNATURE" != "89504e470d0a1a0a" ]; then
            echo "ERRO: icon.png invalido."
            exit 1
          fi

          MANIFEST="ludere/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERRO: AndroidManifest.xml nao encontrado."
            exit 1
          fi

          python3 - "$MANIFEST" <<'PY'
          import re
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          content, count = re.subn(
              r'android:icon="[^"]+"',
              'android:icon="@mipmap/ic_launcher"',
              content
          )

          if count == 0:
              raise SystemExit(
                  "ERRO: android:icon nao encontrado no Manifest."
              )

          content, round_count = re.subn(
              r'android:roundIcon="[^"]+"',
              'android:roundIcon="@mipmap/ic_launcher_round"',
              content
          )

          if round_count == 0:
              print("Aviso: roundIcon nao encontrado.")

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Manifest atualizado.")
          PY

          # Remover icones adaptativos que possam substituir os PNGs.
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          echo "Icone preparado com sucesso."

      - name: Gerar APKs
        working-directory: ludere
        run: |
          set -e
          ./autogen/generate

      - name: Localizar APK universal
        run: |
          set -e

          echo "Arquivos APK gerados:"
          find ludere/autogen/output -type f -name '*.apk' -print

          APK_DIR="ludere/autogen/output/universal"
          APK=""

          if [ -d "$APK_DIR" ]; then
            APK="$(find "$APK_DIR" -type f \
              -name '*.apk' -print -quit)"
          fi

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK encontrado na pasta universal."
            echo "Verifique os logs da etapa Gerar APKs."
            exit 1
          fi

          mkdir -p release

          cp "$APK" release/SuperBomberman5-Universal.apk

          echo "APK escolhido: $APK"
          ls -lh release/SuperBomberman5-Universal.apk

      - name: Publicar APK universal
        uses: actions/upload-artifact@v4
        with:
          name: SuperBomberman5-APK-Universal
          path: release/SuperBomberman5-Universal.apk
          if-no-files-found: error
          retention-days: 7
