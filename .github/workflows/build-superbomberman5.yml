name: Construir Super Bomberman 5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Fazer checkout do repositorio do jogo
        uses: actions/checkout@v4

      - name: Baixar meu fork do Ludere
        run: |
          set -e
          git clone --depth 1 \
            https://github.com/JosueRess/Ludere.git ludere

      - name: Instalar dependencias
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y imagemagick file unzip

      - name: Preparar payload do jogo
        run: |
          set -e

          PAYLOAD="SuperBomberman5_Autogen_Payload.zip"

          if [ ! -f "$PAYLOAD" ]; then
            echo "ERRO: payload nao encontrado: $PAYLOAD"
            ls -la
            exit 1
          fi

          mkdir -p ludere/autogen/input
          cp "$PAYLOAD" ludere/autogen/input/payload.zip

          unzip -o ludere/autogen/input/payload.zip \
            -d ludere/autogen/input/

          rm -f ludere/autogen/input/payload.zip

      - name: Preparar e validar icone
        run: |
          set -e

          RES="ludere/app/src/main/res"
          TEMP="/tmp/superbomberman-icon.png"

          # Procurar icon.png no repositorio principal.
          ICON="$(find . \
            -path './.git' -prune -o \
            -path './ludere' -prune -o \
            -type f -iname 'icon.png' -print -quit)"

          # Se nao existir, procurar no fork do Ludere.
          if [ -z "$ICON" ]; then
            ICON="$(find ludere/app/src/main/res \
              -type f -iname 'icon.png' -print -quit)"
          fi

          if [ -z "$ICON" ] || [ ! -f "$ICON" ]; then
            echo "ERRO: icon.png nao encontrado."
            echo "Coloque o arquivo icon.png na raiz do repositorio principal."
            exit 1
          fi

          echo "Icone encontrado: $ICON"
          file "$ICON"

          # Converter a imagem original em PNG real.
          convert "$ICON" \
            -background none \
            -alpha on \
            -strip \
            PNG32:"$TEMP"

          # Verificar a assinatura PNG.
          SIGNATURE="$(od -An -tx1 -N8 "$TEMP" | tr -d ' \n')"

          if [ "$SIGNATURE" != "89504e470d0a1a0a" ]; then
            echo "ERRO: nao foi possivel gerar um PNG valido."
            exit 1
          fi

          file "$TEMP"
          identify "$TEMP"

          # Atualizar os icones utilizados pelo Manifest.
          for ITEM in \
            "mipmap-mdpi 48" \
            "mipmap-hdpi 72" \
            "mipmap-xhdpi 96" \
            "mipmap-xxhdpi 144" \
            "mipmap-xxxhdpi 192"
          do
            set -- $ITEM
            DIR="$RES/$1"
            SIZE="$2"

            mkdir -p "$DIR"

            convert "$TEMP" \
              -resize "${SIZE}x${SIZE}" \
              "$DIR/ic_launcher.png"

            convert "$TEMP" \
              -resize "${SIZE}x${SIZE}" \
              "$DIR/ic_launcher_round.png"
          done

          # Corrigir tambem o arquivo que aparece no erro do AAPT.
          mkdir -p "$RES/mipmap-xxxhdpi"

          convert "$TEMP" \
            -resize "192x192" \
            "$RES/mipmap-xxxhdpi/icon.png"

          # Validar especificamente o arquivo que falhou.
          file "$RES/mipmap-xxxhdpi/icon.png"

          ICON_SIGNATURE="$(od -An -tx1 -N8 \
            "$RES/mipmap-xxxhdpi/icon.png" | tr -d ' \n')"

          if [ "$ICON_SIGNATURE" != "89504e470d0a1a0a" ]; then
            echo "ERRO: icon.png continua invalido."
            exit 1
          fi

          # Configurar os icones no Manifest.
          MANIFEST="ludere/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERRO: AndroidManifest.xml nao encontrado."
            exit 1
          fi

          python3 - "$MANIFEST" <<'PY'
          import re
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          content, icon_count = re.subn(
              r'android:icon="[^"]+"',
              'android:icon="@mipmap/ic_launcher"',
              content
          )

          content, round_count = re.subn(
              r'android:roundIcon="[^"]+"',
              'android:roundIcon="@mipmap/ic_launcher_round"',
              content
          )

          if icon_count == 0:
              raise SystemExit(
                  "ERRO: android:icon nao encontrado no Manifest."
              )

          if round_count == 0:
              print(
                  "Aviso: android:roundIcon nao existia no Manifest."
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Manifest atualizado.")
          PY

          # Remover icones adaptativos que poderiam substituir
          # os PNGs tradicionais.
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          echo "Icones preparados:"
          find "$RES" -iname '*ic_launcher*' -o -name 'icon.png'

          echo "Manifest:"
          grep -nE 'android:(icon|roundIcon)=' "$MANIFEST"

      - name: Executar gerador do Ludere
        working-directory: ludere
        run: |
          set -e
          chmod +x ./autogen/generate
          ./autogen/generate

      - name: Localizar APK universal
        if: success()
        run: |
          set -e

          echo "APK encontrados:"
          find ludere -type f -name '*.apk' -print

          APK=""

          APK="$(find ludere -type f \
            -iname '*universal*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERRO: o gerador nao produziu APK universal."
            echo "Verifique os APKs e os logs da etapa anterior."
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/SuperBomberman5-Universal.apk

          echo "APK selecionado: $APK"
          ls -lh release/SuperBomberman5-Universal.apk

      - name: Publicar APK universal
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SuperBomberman5-APK-Universal
          path: release/SuperBomberman5-Universal.apk
          if-no-files-found: error
          retention-days: 7
