name: Build Super Bomberman 5 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download private project source
        uses: actions/checkout@v4

      - name: Prepare the game payload
        run: |
          test -f ./SuperBomberman5_Autogen_Payload.zip
          mkdir -p ./autogen/input
          unzip -o ./SuperBomberman5_Autogen_Payload.zip -d ./autogen/input

      - name: Install build helper tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xmlstarlet zip

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build the game APKs
        run: |
          chmod +x ./gradlew ./autogen/generate
          ./autogen/generate

      - name: Collect Android APKs
        run: |
          mkdir -p ./artifacts
          cp ./autogen/output/arm64-v8a/snes9x_superbomberman5.apk ./artifacts/SuperBomberman5-arm64-v8a.apk
          cp ./autogen/output/armeabi-v7a/snes9x_superbomberman5.apk ./artifacts/SuperBomberman5-armeabi-v7a.apk

      - name: Save APKs as a private build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperBomberman5-APKs
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 7
