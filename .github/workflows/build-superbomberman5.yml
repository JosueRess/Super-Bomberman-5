
name: Build Super Bomberman 5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4

      - name: Download Ludere source
        run: |
          git clone --depth 1 \
            https://github.com/tytydraco/Ludere.git ludere

      - name: Prepare game payload
        run: |
          mkdir -p ludere/autogen/input
          cp SuperBomberman5_Autogen_Payload.zip \
            ludere/autogen/input/payload.zip
          unzip ludere/autogen/input/payload.zip \
            -d ludere/autogen/input/
          rm ludere/autogen/input/payload.zip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xmlstarlet

      - name: Generate game APK
        working-directory: ludere
        run: |
          chmod +x ./autogen/generate
          ./autogen/generate

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: SuperBomberman5-output
          path: ludere/autogen/output/
          if-no-files-found: error
          retention-days: 7
